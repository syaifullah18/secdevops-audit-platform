{{- if .Values.redis.enabled }}
# Evaluation only: one replica, no auth, no TLS. Use a managed or operator-run Redis in production.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "sdap.fullname" . }}-redis
  labels:
    {{- include "sdap.labels" (dict "ctx" . "component" "redis") | nindent 4 }}
spec:
  serviceName: {{ include "sdap.fullname" . }}-redis
  replicas: 1
  selector:
    matchLabels:
      {{- include "sdap.selectorLabels" (dict "ctx" . "component" "redis") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sdap.selectorLabels" (dict "ctx" . "component" "redis") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: {{ .Values.redis.image | quote }}
          args: ["--appendonly", "yes"]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 10
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- if .Values.redis.storageClassName }}
        storageClassName: {{ .Values.redis.storageClassName }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.redis.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sdap.fullname" . }}-redis
  labels:
    {{- include "sdap.labels" (dict "ctx" . "component" "redis") | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "sdap.selectorLabels" (dict "ctx" . "component" "redis") | nindent 4 }}
  ports:
    - name: redis
      port: 6379
{{- end }}
