# Development override: expose datastores on localhost, accept dev bearer tokens, debug logs.
#   docker compose -f docker-compose.yml -f deploy/compose/docker-compose.dev.yml up --build
# Never use this file for anything reachable from a network.
services:
  postgres:
    ports:
      - "127.0.0.1:5432:5432"
  redis:
    ports:
      - "127.0.0.1:6379:6379"
  api:
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
      AUTH_DEV_MODE: "true"
  worker:
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
  prometheus:
    ports:
      - "127.0.0.1:9090:9090"
  loki:
    ports:
      - "127.0.0.1:3100:3100"
