{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "sdap.fullname" . }}
  labels:
    {{- include "sdap.labels" (dict "ctx" . "component" "sdap") | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Pods do not call the Kubernetes API.
automountServiceAccountToken: false
{{- end }}
